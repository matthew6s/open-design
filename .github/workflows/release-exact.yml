name: release-exact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full current-main commit to build
        required: true
        type: string
      channel:
        description: Isolated exact channel
        required: true
        type: choice
        options: [betahyx, previewhyx]
      release_version:
        description: Counted channel version, for example 0.1.0-betahyx.1
        required: true
        type: string
      standalone_version:
        description: Independently versioned Standalone runtime
        required: true
        default: 0.1.0
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-exact-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release-neutral Terminal scenes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.convergence.outputs.run }}
    steps:
      - name: Validate immutable inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$DISPATCH_SHA"
          [[ "$CHANNEL" == "betahyx" || "$CHANNEL" == "previewhyx" ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-${CHANNEL}\.[0-9]+$ ]]

      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Resolve reusable scene results
        id: convergence
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-plan"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "exact-plan", "scope.json").write_text(json.dumps({"enabled": {"terminal_scene_darwin_arm64": True, "terminal_scene_win32_x64": True}}, sort_keys=True) + "\n")
          PY
          python3 .github/scripts/convergence.py \
            --config .github/config/convergence-exact.json \
            github-output \
            --workflow release-exact \
            --scope-plan "$RUNNER_TEMP/exact-plan/scope.json" \
            --runner-plan-json '{"terminal_darwin_arm64":["macos-15"],"terminal_win32_x64":["windows-latest"]}' \
            --mode enforce \
            --pending "$RUNNER_TEMP/exact-plan/pending.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan/pending.json
          if-no-files-found: error
          retention-days: 1

  scene:
    name: Terminal scene (${{ matrix.target }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            workload: terminal_scene_darwin_arm64
            runs_on: macos-15
          - target: win32-x64
            workload: terminal_scene_win32_x64
            runs_on: windows-latest
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - name: Restore converged scene
        if: ${{ !fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ["RUNNER_TEMP"])
          workload = json.loads((root / "exact-plan" / "pending.json").read_text())["workloads"][os.environ["WORKLOAD"]]
          result = workload.get("result")
          if not workload.get("resultHit") or not result:
              raise SystemExit("convergence planner omitted a required scene without a result")
          product = result["products"]["scene"]
          archive = root / "exact-scene-cache.zip"
          urllib.request.urlretrieve(product["source"], archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != product["data"]["sha256"]:
              raise SystemExit("converged scene product digest mismatch")
          destination = root / "exact-scene"
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  path = PurePosixPath(entry.filename.rstrip("/"))
                  if not entry.filename or entry.filename.startswith(("/", "\\")) or "\\" in entry.filename or ".." in path.parts:
                      raise SystemExit(f"unsafe converged scene entry: {entry.filename!r}")
              source.extractall(destination)
          PY

      - uses: pnpm/action-setup@v5
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Build release-neutral scene inputs
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @open-design/standalone build
          pnpm --filter @open-design/closure build
          mkdir -p "$RUNNER_TEMP/exact-node"
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          lock = json.loads(Path("shells/terminal/node-lock.json").read_text())
          value = lock["targets"][os.environ["TARGET"]]
          destination = Path(os.environ["RUNNER_TEMP"], "exact-node", value["archive"])
          urllib.request.urlretrieve(value["url"], destination)
          if hashlib.sha256(destination.read_bytes()).hexdigest() != value["sha256"]:
              raise SystemExit("official Node archive digest mismatch")
          request = {
              "schemaVersion": 1,
              "operation": "terminal.scene.build",
              "target": os.environ["TARGET"],
              "shellVersion": Path("shells/terminal/version").read_text().strip(),
              "node": {"version": lock["version"], "archiveFile": str(destination), "archiveSha256": value["sha256"]},
              "closureArtifactFile": str(Path("apps/closure/dist/fixture.mjs").resolve()),
              "standaloneDirectory": str(Path("packages/standalone/dist").resolve()),
              "sceneDirectory": str(Path(os.environ["RUNNER_TEMP"], "exact-scene")),
          }
          Path(os.environ["RUNNER_TEMP"], "exact-scene-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Build Darwin Terminal scene
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: sh shells/terminal/sh/scene.sh --request "$RUNNER_TEMP/exact-scene-request.json" --receipt "$RUNNER_TEMP/exact-scene-receipt.json"

      - name: Build Windows Terminal scene
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] && startsWith(matrix.target, 'win32-') }}
        shell: pwsh
        run: ./shells/terminal/ps1/scene.ps1 -Request "$env:RUNNER_TEMP/exact-scene-request.json" -Receipt "$env:RUNNER_TEMP/exact-scene-receipt.json"

      - name: Verify scene and prepare convergence product
        env:
          ARTIFACT_NAME: exact-terminal-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          TARGET: ${{ matrix.target }}
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          scene = json.loads((root / "exact-scene" / "scene.json").read_text())
          if scene.get("target") != os.environ["TARGET"] or not isinstance(scene.get("shellBuildHash"), str):
              raise SystemExit("restored or built Terminal scene identity mismatch")
          encoded = json.dumps(scene, sort_keys=True)
          for release_field in ("betahyx", "previewhyx", "publishedAt", "artifactBaseUrl", "signatures"):
              if release_field in encoded:
                  raise SystemExit(f"Terminal scene contains release-owned field: {release_field}")
          pending = json.loads((root / "exact-plan" / "pending.json").read_text())["workloads"][os.environ["WORKLOAD"]]
          if pending["run"]:
              destination = root / "convergence-products" / os.environ["WORKLOAD"]
              destination.mkdir(parents=True)
              manifest = {
                  "workload": os.environ["WORKLOAD"],
                  "digest": pending["digest"],
                  "executionClass": pending["executionClass"],
                  "products": {"scene": {"type": "job", "source": os.environ["ARTIFACT_NAME"], "data": {"target": os.environ["TARGET"]}}},
              }
              (destination / "product-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exact-terminal-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/exact-scene
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.plan.outputs.run)[matrix.workload] }}
        with:
          name: exact-convergence-manifest-${{ matrix.workload }}-${{ github.run_id }}
          path: ${{ runner.temp }}/convergence-products
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: Prepare signed exact content
    needs: [scene]
    runs-on: ubuntu-24.04
    environment: standalone-exact-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-terminal-scene-*-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scenes

      - name: Read previous content floor when available
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLIC_ORIGIN: ${{ secrets.EXACT_RELEASE_PUBLIC_ORIGIN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          try:
              with urllib.request.urlopen(f"{os.environ['PUBLIC_ORIGIN'].rstrip('/')}/{os.environ['CHANNEL']}/latest/channel-head.json", timeout=10) as response:
                  head = json.load(response)["head"]
              with urllib.request.urlopen(head["lanes"]["content"]["url"], timeout=10) as response:
                  (root / "previous-content-metadata.json").write_bytes(response.read())
          except (KeyError, OSError, urllib.error.URLError, json.JSONDecodeError):
              pass
          PY

      - name: Compose and sign content metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STANDALONE_VERSION: ${{ inputs.standalone_version }}
          PUBLIC_ORIGIN: ${{ secrets.EXACT_RELEASE_PUBLIC_ORIGIN }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          scenes = []
          for target in ("darwin-arm64", "win32-x64"):
              directory = root / "scenes" / f"exact-terminal-scene-{target}-{os.environ['SOURCE_SHA']}"
              manifest = directory / "scene.json"
              scenes.append({"target": target, "sceneDirectory": str(directory), "sceneManifestSha256": hashlib.sha256(manifest.read_bytes()).hexdigest()})
          published_at = subprocess.check_output(["git", "show", "--no-patch", "--format=%cI", os.environ["SOURCE_SHA"]], text=True).strip()
          request = {
              "schemaVersion": 1,
              "operation": "exact.prepare",
              "channel": os.environ["CHANNEL"],
              "releaseVersion": os.environ["RELEASE_VERSION"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "publishedAt": published_at,
              "standaloneVersion": os.environ["STANDALONE_VERSION"],
              "shellVersion": Path("shells/terminal/version").read_text().strip(),
              "artifactBaseUrl": f"{os.environ['PUBLIC_ORIGIN'].rstrip('/')}/{os.environ['CHANNEL']}/{os.environ['RELEASE_VERSION']}",
              "closureArtifactFile": str(root / "scenes" / f"exact-terminal-scene-darwin-arm64-{os.environ['SOURCE_SHA']}" / "seed" / "closure.mjs"),
              "scenes": scenes,
              "outputDirectory": str(root / "exact-prepare"),
          }
          previous = root / "previous-content-metadata.json"
          if previous.is_file(): request["previousContentMetadataFile"] = str(previous)
          (root / "exact-prepare-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/pack.py --request "$RUNNER_TEMP/exact-prepare-request.json" --receipt "$RUNNER_TEMP/exact-prepare/prepare-receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-prepared-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/exact-prepare
          if-no-files-found: error
          retention-days: 1

  distribution:
    name: Terminal distribution (${{ matrix.target }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runs_on: macos-15
          - target: win32-x64
            runs_on: windows-latest
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: exact-terminal-scene-${{ matrix.target }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/scene

      - uses: actions/download-artifact@v8
        with:
          name: exact-prepared-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/prepared

      - name: Write native distribution request
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          prepared = json.loads((root / "prepared" / "prepare-receipt.json").read_text())
          scene = root / "scene"
          request = {
              "schemaVersion": 1,
              "operation": "terminal.distribution.build",
              "target": os.environ["TARGET"],
              "sceneDirectory": str(scene),
              "sceneManifestSha256": hashlib.sha256((scene / "scene.json").read_bytes()).hexdigest(),
              "releaseDocumentsDirectory": str(root / "prepared" / "documents"),
              "trustFile": str(root / "prepared" / "trust" / "keys.json"),
              "release": {"channel": os.environ["CHANNEL"], "releaseVersion": os.environ["RELEASE_VERSION"], "sourceCommit": os.environ["SOURCE_SHA"], "publishedAt": prepared["publishedAt"], "artifactBaseUrl": prepared["artifactBaseUrl"]},
              "outputDirectory": str(root / "distribution"),
          }
          (root / "distribution-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Build Darwin distribution
        if: ${{ startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: sh shells/terminal/sh/distribution.sh --request "$RUNNER_TEMP/distribution-request.json" --receipt "$RUNNER_TEMP/distribution/distribution-receipt.json"

      - name: Build Windows distribution
        if: ${{ startsWith(matrix.target, 'win32-') }}
        shell: pwsh
        run: ./shells/terminal/ps1/distribution.ps1 -Request "$env:RUNNER_TEMP/distribution-request.json" -Receipt "$env:RUNNER_TEMP/distribution/distribution-receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: exact-distribution-${{ matrix.target }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/distribution
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Finalize and publish exact channel
    needs: [plan, distribution]
    runs-on: ubuntu-24.04
    environment: standalone-exact-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - uses: actions/download-artifact@v8
        with:
          name: exact-prepared-${{ inputs.channel }}-${{ inputs.release_version }}
          path: ${{ runner.temp }}/prepared

      - uses: actions/download-artifact@v8
        with:
          pattern: exact-distribution-*-${{ inputs.release_version }}
          path: ${{ runner.temp }}/distributions

      - name: Finalize signed Shell sidecar and channel head
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          OD_EXACT_SIGNING_KEY_ID: ${{ secrets.EXACT_SIGNING_KEY_ID }}
          OD_EXACT_ED25519_PRIVATE_KEY: ${{ secrets.EXACT_ED25519_PRIVATE_KEY }}
          OD_EXACT_SIGNING_KEY_ID_NEXT: ${{ secrets.EXACT_SIGNING_KEY_ID_NEXT }}
          OD_EXACT_ED25519_PRIVATE_KEY_NEXT: ${{ secrets.EXACT_ED25519_PRIVATE_KEY_NEXT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          distributions = []
          for target in ("darwin-arm64", "win32-x64"):
              directory = root / "distributions" / f"exact-distribution-{target}-{os.environ['RELEASE_VERSION']}"
              receipt = json.loads((directory / "distribution-receipt.json").read_text())
              receipt["archive"]["file"] = str(directory / Path(receipt["archive"]["file"]).name)
              (directory / "relocated-receipt.json").write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
              distributions.append({"receipt": str(directory / "relocated-receipt.json")})
          request = {
              "schemaVersion": 1,
              "operation": "exact.finalize",
              "prepareReceipt": str(root / "prepared" / "prepare-receipt.json"),
              "contentMetadataFile": str(root / "prepared" / "documents" / "content-metadata.json"),
              "closureArtifactFile": str(root / "prepared" / "artifacts" / next((root / "prepared" / "artifacts").iterdir()).name),
              "distributions": distributions,
              "outputDirectory": str(root / "exact-final"),
          }
          (root / "exact-finalize-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/pack.py --request "$RUNNER_TEMP/exact-finalize-request.json" --receipt "$RUNNER_TEMP/exact-final/pack-receipt.json"

      - name: Publish immutable release and latest channel CAS
        env:
          OD_EXACT_RELEASE_TOKEN: ${{ secrets.EXACT_RELEASE_TOKEN }}
          STORAGE_ENDPOINT: ${{ secrets.EXACT_RELEASE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.EXACT_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          request = {"schemaVersion": 1, "operation": "exact.release", "packReceipt": str(root / "exact-final" / "pack-receipt.json"), "endpointUrl": os.environ["STORAGE_ENDPOINT"], "bucket": os.environ["STORAGE_BUCKET"]}
          (root / "exact-release-request.json").write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          python3 .github/scripts/release.py --request "$RUNNER_TEMP/exact-release-request.json" --receipt "$RUNNER_TEMP/exact-final/release-receipt.json"

      - uses: actions/download-artifact@v8
        with:
          name: exact-convergence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-plan

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: exact-convergence-manifest-*-${{ github.run_id }}
          path: ${{ runner.temp }}/convergence-products
          merge-multiple: true

      - name: Create reusable scene handoff
        id: convergence_handoff
        continue-on-error: true
        run: >-
          python3 .github/scripts/convergence.py
          --config .github/config/convergence-exact.json
          handoff
          --pending "$RUNNER_TEMP/exact-plan/pending.json"
          --products-root "$RUNNER_TEMP/convergence-products"
          --handoff-root "$RUNNER_TEMP/handoff-convergence-exact-scenes"
          --id exact-scenes

      - name: Upload reusable scene handoff
        if: ${{ steps.convergence_handoff.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.convergence_handoff.outputs.name }}
          path: ${{ steps.convergence_handoff.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-${{ inputs.channel }}-${{ inputs.release_version }}-receipts
          path: |
            ${{ runner.temp }}/exact-final/*.json
            ${{ runner.temp }}/exact-final/documents/*.json
            ${{ runner.temp }}/exact-finalize-request.json
            ${{ runner.temp }}/exact-release-request.json
          if-no-files-found: error
          retention-days: 30
